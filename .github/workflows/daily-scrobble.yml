name: 网易云每日刷歌

on:
  schedule:
    - cron: '1 0/8 * * *'  
  workflow_dispatch:      # 支持手动触发

jobs:
  scrobble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          
      - name: 编译 ncmctl
        run: go build -o ncmctl ./cmd/ncmctl
        
      - name: 登录并执行每日任务
        env:
          NCM_COOKIE: ${{ secrets.NCM_COOKIE }}
        run: |
          # 将 Cookie 写入临时文件（匹配工具官方用法）
          echo "$NCM_COOKIE" > cookie.txt
          # 使用 Cookie 文件登录
          ./ncmctl login cookie --file cookie.txt
          # 执行每日任务：签到 + 刷歌300首
          ./ncmctl task --sign --scrobble
